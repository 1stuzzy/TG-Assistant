<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — TG-Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1.4.1">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand" style="margin-bottom:16px">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.5 4.5L2.7 11.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.9.9.9.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.2 1.8-.8L23.9 5.7c.3-1.3-.5-1.9-1.4-1.5z" fill="white" fill-opacity=".95"/></svg>
      </div>
      <div>
        <div class="brand-name">TG-Assistant</div>
        <div class="brand-sub">вход в панель</div>
      </div>
    </div>
    <h1>Войти</h1>
    <p class="login-lead">Данные для входа выдает администратор.</p>
    <div class="error-text" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label>Логин</label>
        <input class="text-input" id="loginInput" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input class="text-input" id="passwordInput" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" id="loginBtn" style="width:100%">Войти</button>
    </form>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>
  <script src="js/api.js?v=1.4.1"></script>
  <script>
    const API_BASE = (location.port === '5500' || location.port === '5501')
      ? 'http://localhost:8000'
      : location.origin;
    const api = new ApiClient(API_BASE);
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    function toast(text) {
      const wrap = document.getElementById('toastWrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = 'toast err';
      el.innerHTML = '<span class="tdot"></span>' + text;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity .25s';
        setTimeout(() => el.remove(), 250);
      }, 4200);
    }

    api.me().then(() => { location.href = '/'; }).catch(() => {});
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show', 'warn');
      err.textContent = '';
      btn.disabled = true;
      try {
        await api.login(
          document.getElementById('loginInput').value.trim(),
          document.getElementById('passwordInput').value
        );
        location.href = '/';
      } catch (ex) {
        const msg = ex.message || 'Не удалось войти';
        err.textContent = msg;
        err.classList.add('show');
        if (/приостановлен/i.test(msg)) err.classList.add('warn');
        toast(msg);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
